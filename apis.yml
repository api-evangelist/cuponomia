description: >-
  Cuponomia is a Brazilian coupons and cashback platform that helps consumers
  save money on online purchases from more than 2,000 partner retailers. A
  pioneer in popularizing free discount coupons in Brazil, the company expanded
  into cashback in 2019 and now operates a website, a browser extension, and
  mobile apps alongside a Prime membership tier. It is backed by 500 Global.
  Cuponomia does not currently publish a public developer API, SDK, or OpenAPI
  definition; this profile captures its public web presence and domain-security
  posture for the API Evangelist network.
